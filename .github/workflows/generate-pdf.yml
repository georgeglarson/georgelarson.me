name: Generate PDF resume

on:
  push:
    branches: [main]
    paths:
      - resume.txt
      - scripts/generate_pdf.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install weasyprint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libcairo2 > /dev/null
          pip install -q weasyprint

      - name: Generate PDF
        run: python scripts/generate_pdf.py

      - name: Commit PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add george-larson-resume.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Auto-generate PDF resume from resume.txt"
            git push
          fi
