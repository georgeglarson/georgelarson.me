# OSS contributions curation — authoritative source for /contributions.
# Consumed by scripts/build_contributions.py.
#
# Why a curated file and not pure `gh search`: GitHub's search index has gaps and
# silently drops some older PRs (opencode 2025-11, models.dev 2025-12, largo 2014
# are all merged-by-georgeglarson but never appear in `gh search prs --merged`).
# So this yaml is the display source of truth, and `gh search` is the detection
# layer that flags drift (a new merge or open PR not yet curated here).
#
# Edit this file, run `python3 scripts/build_contributions.py --write`, eyeball
# the diff, commit. See AGENTS.md (Contributions page).

# --- Merged receipts (authoritative; the portfolio count draws from this set) ---
# Generator sorts by `merged` date descending. `merged` = GitHub merge date.
merged:
  - {repo: OpenHands/software-agent-sdk, number: 4536, merged: 2026-08-19, name: "OpenHands / software-agent-sdk", desc: "`send_message` owns skill activation for every user message: matching the text against the agent's skills, attaching the recalled knowledge to the event, and recording the activation so a skill fires once per conversation. The block shipped carrying its own `# TODO` for test cases. These pin the wiring."}
  - {repo: OpenHands/software-agent-sdk, number: 4526, merged: 2026-08-19, name: "OpenHands / software-agent-sdk", desc: "`events_to_messages` is the projection that turns the persisted event log into the messages the model actually sees, and it had carried a `# TODO: We should add extensive tests for this` since it was written. Writing the boundary tests exposed a live defect underneath: reasoning items dropped out of re-batched parallel tool calls. Both land here."}
  - {repo: OpenHands/software-agent-sdk, number: 4482, merged: 2026-08-13, name: "OpenHands / software-agent-sdk", desc: "Adds `POST /file/create_directory` to the file router, so a client can create a workspace folder instead of only listing the ones that already exist. Verified over real HTTP against a running agent-server through a locally built typescript-client: nested paths, repeat calls, and immediate visibility to the folder picker's own listing endpoint."}
  - {repo: OpenHands/OpenHands, number: 16534, merged: 2026-08-12, name: OpenHands, desc: "The context meter drew its ring track from a border token, which left the track washed out against the surface behind it. Draws it from the foreground colour instead. Checked by building the full stack from `main` and from the branch with nothing else changed, then reading the rendered colours out of the running app rather than trusting the token names."}
  - {repo: OpenHands/OpenHands, number: 16311, merged: 2026-08-10, name: OpenHands, desc: "A context-window usage meter, a usage drawer, and manual compaction, replacing the old metrics modal. Carries three fixes found along the way: a divide-by-zero on models that report no context window, websocket usage metrics dropped for non-agent usage ids, and a crash on the home route."}
  - {repo: OpenHands/OpenHands, number: 16272, merged: 2026-08-03, name: OpenHands, desc: "The repo ignored three named subdirectories of `.tmp/` while the test harnesses wrote to several more, so runtime state kept turning up in commits. Ignoring the root instead means the list can't fall behind the code again."}
  - {repo: OpenHands/OpenHands, number: 16239, merged: 2026-08-03, name: OpenHands, desc: "The dev launcher handled `SIGINT` and `SIGTERM` but not `SIGHUP`, so closing a terminal or multiplexer killed the launcher and left its detached services running. Reproduced against the real spawn path before and after the fix."}
  - {repo: OpenHands/software-agent-sdk, number: 4150, merged: 2026-07-30, name: "OpenHands / software-agent-sdk", desc: "Verifies the `kimi-for-coding` model id against Moonshot's Kimi Code membership endpoint, so it appears in the agent-canvas model picker with a Verified badge instead of free-typed entry. Companion to agent-canvas #1844."}
  - {repo: OpenHands/OpenHands, number: 16152, merged: 2026-07-29, name: OpenHands, desc: "The mock-LLM end-to-end stack now shuts down gracefully, so a test run stops leaving six orphaned processes and four bound ports behind after Playwright exits."}
  - {repo: OpenHands/agent-canvas, number: 1844, merged: 2026-07-18, name: "OpenHands / agent-canvas", desc: "Adds Moonshot's Kimi Code membership as a first-class provider option, so a Console API key against api.kimi.com/coding/v1 works without free-typing the base URL. Companion to software-agent-sdk #4150, which earns the model its Verified badge."}
  - {repo: kputnam/stupidedi, number: 289, merged: 2026-07-16, name: stupidedi, desc: "Re-enabled the 4010 AR943 and RE944 transaction sets (warehouse stock-transfer shipment and receipt advice), whose autoload had been off on the same outgrown segment-element lists as PO850."}
  - {repo: kputnam/stupidedi, number: 288, merged: 2026-07-13, name: stupidedi, desc: "Re-enabled the 4010 PO850 transaction set, whose autoload had been off because the segment definitions had outgrown its element lists."}
  - {repo: OpenHands/agent-canvas, number: 1368, merged: 2026-07-11, name: "OpenHands / agent-canvas", desc: "Groups workspace folders by parent in the dropdown, so deeply nested paths stay organized instead of flattening into one list."}
  - {repo: ferriskey/ferriskey, number: 1133, merged: 2026-07-08, name: ferriskey, desc: "Adds the `TokenExchange` grant type and its domain value objects, opening RFC 8693 token exchange in the Rust auth server."}
  - {repo: juspay/neurolink, number: 1134, merged: 2026-07-08, name: neurolink, desc: "Moves system messages to the AI SDK `generateText` `system` option instead of the `messages` array. Shipped in v9.82.0 on npm."}
  - {repo: OpenHands/agent-canvas, number: 1434, merged: 2026-06-26, name: "OpenHands / agent-canvas", desc: "The acp-docker example inherits its agent-server image from `config/defaults.json` instead of pinning a version below the Canvas compatibility floor."}
  - {repo: mvanhorn/last30days-skill, number: 564, merged: 2026-06-17, name: last30days-skill, desc: "A `pass(1)` credential source: the Linux analog of the macOS Keychain support, so secrets come from `pass` instead of a `.env` file."}
  - {repo: anomalyco/models.dev, number: 475, merged: 2025-12-06, name: models.dev, desc: "Added the Claude Opus 4.5 entry to the model catalog."}
  - {repo: anomalyco/opencode, number: 4748, merged: 2025-11-26, name: opencode, desc: "Documented the Venice.ai provider."}
