# --- In-review groups (display) ---
# `gh search --state open` provides liveness; this list provides the prose and
# grouping. Generator renders one <li> per group. Detection flags any open gh
# PR whose repo+number isn't covered here, and any number here that's no longer
# open in gh (it merged or closed).
in_review:
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16439, 16441]
    desc: "A user reported his agent quietly switching itself to a weaker model. The `switch_llm` tool ships enabled under a confirmation policy that never asks, so a conversation can end up on a model nobody chose. These expose the off switch the SDK already had but the interface never rendered, and re-derive the model stamp from event history so a dropped socket stops leaving the readout disagreeing with itself."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16426]
    desc: "Adds a provider's whole model catalog as LLM profiles in one pass, instead of one entry at a time."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16600]
    desc: "Conversation tags a user applies by hand, a filter bar across the panel, and per-card collapse, so a long conversation list stays navigable instead of scrolling forever."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16656]
    desc: "A Linux desktop installer lane in CI, mirroring the macOS and Windows builds, plus the four-line maintainer field without which the deb target cannot build at all: fpm refuses the package with no author email."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16279, 16280]
    desc: "The same `SIGHUP` gap as #16239, one launcher over in each case. Orphaned services hold their ports, and a surviving agent-server keeps heartbeating its lease files, so the next start reports every conversation as held and lists none."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16145]
    desc: "A saved-but-not-signed-in ACP credential reads as 'configured' instead of raising the green 'signed in' banner, which on Docker and cloud installs claimed a login that hadn't happened. Re-landed here after agent-canvas moved into this repo."
  - repo: livekit/agents
    name: "livekit / agents"
    numbers: [6280]
    desc: "A fix so a duplicate same-target handoff tool call in one turn no longer reads as ambiguous and aborts the agent switch."
  - repo: allenai/open-instruct
    name: open-instruct
    numbers: [1751]
    desc: "A `--launcher` flag so non-Ai2 users can run the training launcher locally without a Beaker cluster account."
  - repo: stryker-mutator/stryker-net
    name: stryker-net
    numbers: [3694]
    desc: "Extends the array-creation mutator to implicit array creation, a syntax shape it previously had no arm for."
  - repo: kputnam/stupidedi
    name: stupidedi
    numbers: [292, 293]
    desc: "Re-enables the 4010 SM204 (Motor Carrier Load Tender) and SH856 (Ship Notice/Manifest, the 856 ASN), third and fourth in the series after PO850 and AR943/RE944, on the same outgrown-segment fix pattern."
  - repo: mitmproxy/mitmproxy
    name: mitmproxy
    numbers: [8199, 8200]
    desc: "A `Flow.kill()` resume-event fix so teardown closes the client connection, plus a KillInjected event so killing a flow disconnects in-transit connections."
  - repo: charmbracelet/crush
    name: "charmbracelet / crush"
    numbers: [2749, 2750]
    desc: "LSP score-based client selection and single-file-server handling, so single-file language servers start without root markers."

# --- Fixed upstream: filed it, someone else's commit carries the fix ---
# Its own list because it is neither of the two above. A closed-unmerged PR is
# not in review, and the commit that landed is not George's, so it must never
# reach `merged:` or the headline count.
#
# Two shapes, two fields, deliberately not interchangeable:
#   shipped_in     -- a maintainer re-implemented the idea and credited it by
#                     name. The strong claim. Only use it when a reader can
#                     click through to the maintainer's own words.
#   fixed_upstream -- the same problem got fixed by someone else's PR, with no
#                     mention of George anywhere. The weak claim, and the honest
#                     one for most of these. Says the problem is gone, no more.
# Add `shipped_in_repo` / `fixed_upstream_repo` if the target lives elsewhere.
#
# Every target must be MERGED. Two earlier candidates failed exactly this test:
# opencode #24871 stood down for #15595, which was later closed unmerged, and
# #25141 for #20103, still open. In both cases the bug is still there, so the
# honest description is "yielded to a PR that stalled", which is not a receipt.
# `verify_upstream_targets` enforces this against live GitHub so the rule is
# checked rather than remembered.
#
# This list is not a ledger of every closed PR and must not be read as one. The
# entry criterion is a merged upstream commit that a reader can open. Closures
# with no upstream landing (CLA machinery that never unstuck, maintainer scope
# calls, stale-bot expiry, ones George withdrew himself) stay off the page.
credited:
  - repo: n8n-io/n8n
    number: 29516
    shipped_in: 35456
    name: n8n
    desc: "A per-runner consecutive-timeout counter that detects and recovers stuck task-runner channels, cutting detection from hours to about six seconds. The PR predated a rework of the same `acceptOffer` path, so a maintainer re-implemented the idea on current master and credited the diagnosis by name. Shipped to the 2.33 and 2.34 release lines."
    extra: ' <a class="lnk" href="/n8n">The full hunt &rarr;</a>'
  - repo: OpenHands/OpenHands
    number: 16415
    fixed_upstream: 16453
    name: OpenHands
    desc: "The Basic LLM provider list stopped at 100 entries because the server's pagination cursor was discarded, putting `together_ai`, `vertex_ai`, and `xai` out of reach in every provider dropdown. Reproduced against unmodified upstream main. #16453 fixed the same bug from the other direction, dropping the limit rather than following the cursor."
  - repo: OpenHands/OpenHands
    number: 16443
    fixed_upstream: 16504
    name: OpenHands
    desc: "A `ProgressEvent` test fallback that could never install itself: it was guarded on the symbol being absent, and jsdom always defines it, which left the request interceptor free to throw during teardown and redden an otherwise passing run. #16504 landed the same root cause. It ships no test, so the 1000-iteration repro lives in that PR's description rather than in the suite."
  - repo: charmbracelet/catwalk
    number: 112
    fixed_upstream: 137
    name: "charmbracelet / catwalk"
    desc: "Added the missing Venice.ai models to the provider catalog by hand. The maintainers took the general fix instead, generating the whole provider config and refreshing it daily, so the catalog stops going stale between contributions."

