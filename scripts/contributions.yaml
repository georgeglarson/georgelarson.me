# OSS contributions curation — authoritative source for /contributions.
# Consumed by scripts/build_contributions.py.
#
# Why a curated file and not pure `gh search`: GitHub's search index has gaps and
# silently drops some older PRs (opencode 2025-11, models.dev 2025-12, largo 2014
# are all merged-by-georgeglarson but never appear in `gh search prs --merged`).
# So this yaml is the display source of truth, and `gh search` is the detection
# layer that flags drift (a new merge or open PR not yet curated here).
#
# Edit this file, run `python3 scripts/build_contributions.py --write`, eyeball
# the diff, commit. See AGENTS.md (Contributions page).

# --- Merged receipts (authoritative; the portfolio count draws from this set) ---
# Generator sorts by `merged` date descending. `merged` = GitHub merge date.
merged:
  - {repo: OpenHands/OpenHands, number: 16272, merged: 2026-08-03, name: OpenHands, desc: "`.tmp/` was ignored three named subdirectories at a time while the harnesses wrote to more, so runtime state kept reaching commits. Ignores the root instead."}
  - {repo: OpenHands/OpenHands, number: 16239, merged: 2026-08-03, name: OpenHands, desc: "The dev launcher handled SIGINT and SIGTERM but not SIGHUP, so closing a terminal orphaned its detached services. Reproduced against the real spawn path on both sides of the fix."}
  - {repo: OpenHands/software-agent-sdk, number: 4150, merged: 2026-07-30, name: "OpenHands / software-agent-sdk", desc: "Verifies the `kimi-for-coding` model id against Moonshot's membership endpoint, so it earns the Verified badge in the model picker."}
  - {repo: OpenHands/OpenHands, number: 16152, merged: 2026-07-29, name: OpenHands, desc: "The mock-LLM end-to-end stack shuts down gracefully instead of leaving six orphaned processes and four bound ports behind after Playwright exits."}
  - {repo: OpenHands/agent-canvas, number: 1844, merged: 2026-07-18, name: "OpenHands / agent-canvas", desc: "Adds Kimi Code membership as a first-class Moonshot option in the model picker."}
  - {repo: kputnam/stupidedi, number: 289, merged: 2026-07-16, name: stupidedi, desc: "Re-enabled the 4010 AR943 and RE944 warehouse pair, the same outgrown element lists as PO850 plus positional slot shifts."}
  - {repo: kputnam/stupidedi, number: 288, merged: 2026-07-13, name: stupidedi, desc: "Re-enabled the 4010 PO850 transaction set, whose autoload had been off because the segment definitions had outgrown its element lists."}
  - {repo: OpenHands/agent-canvas, number: 1368, merged: 2026-07-11, name: "OpenHands / agent-canvas", desc: "Groups workspace folders by parent in the dropdown, so deeply nested paths stay organized instead of flattening into one list."}
  - {repo: ferriskey/ferriskey, number: 1133, merged: 2026-07-08, name: ferriskey, desc: "Adds the `TokenExchange` grant type and its domain value objects, opening RFC 8693 token exchange in the Rust auth server."}
  - {repo: juspay/neurolink, number: 1134, merged: 2026-07-08, name: neurolink, desc: "Moves system messages to the AI SDK `generateText` `system` option instead of the `messages` array. Shipped in v9.82.0 on npm."}
  - {repo: OpenHands/agent-canvas, number: 1434, merged: 2026-06-26, name: "OpenHands / agent-canvas", desc: "The acp-docker example inherits its agent-server image from `config/defaults.json` instead of pinning a version below the Canvas compatibility floor."}
  - {repo: mvanhorn/last30days-skill, number: 564, merged: 2026-06-17, name: last30days-skill, desc: "A `pass(1)` credential source: the Linux analog of the macOS Keychain support, so secrets come from `pass` instead of a `.env` file."}
  - {repo: anomalyco/models.dev, number: 475, merged: 2025-12-06, name: models.dev, desc: "Added the Claude Opus 4.5 entry to the model catalog."}
  - {repo: anomalyco/opencode, number: 4748, merged: 2025-11-26, name: opencode, desc: "Documented the Venice.ai provider."}
  - {repo: WPBuddy/largo, number: 164, merged: 2014-03-10, name: largo, desc: "Updated the LESS syntax in `mixins.less` for the WordPress theme. The long end of the track record."}

# --- In-review groups (display) ---
# `gh search --state open` provides liveness; this list provides the prose and
# grouping. Generator renders one <li> per group. Detection flags any open gh
# PR whose repo+number isn't covered here, and any number here that's no longer
# open in gh (it merged or closed).
in_review:
  - repo: livekit/agents
    name: "livekit / agents"
    numbers: [6280]
    desc: "A fix so a duplicate same-target handoff tool call in one turn no longer reads as ambiguous and aborts the agent switch."
  - repo: allenai/open-instruct
    name: open-instruct
    numbers: [1751]
    desc: "A `--launcher` flag so non-Ai2 users can run the training launcher locally without a Beaker cluster account."
  - repo: stryker-mutator/stryker-net
    name: stryker-net
    numbers: [3694]
    desc: "Extends the array-creation mutator to implicit array creation, a syntax shape it previously had no arm for."
  - repo: kputnam/stupidedi
    name: stupidedi
    numbers: [292, 293]
    desc: "Re-enable the 4010 SM204 and SH856 transaction sets (motor-carrier load tender and the 856 advance ship notice), the same outgrown segment-element lists as the merged PO850 and AR943/RE944 pairs."
  - repo: mitmproxy/mitmproxy
    name: mitmproxy
    numbers: [8199, 8200]
    desc: "A `Flow.kill()` resume-event fix so teardown closes the client connection, plus a KillInjected event so killing a flow disconnects in-transit connections."
  - repo: charmbracelet/crush
    name: "charmbracelet / crush"
    numbers: [2749, 2750]
    desc: "LSP score-based client selection and single-file-server handling, so single-file language servers start without root markers."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16145]
    desc: "Surfaces a \"credentials configured\" banner on Docker and cloud, so the configured state is visible at a glance. Re-landed on the monorepo at a maintainer's written request after the agent-canvas repo was archived."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16439, 16441]
    desc: "A user reported in Slack that his agent kept switching itself to a weaker model. The `switch_llm` tool ships enabled and runs under a confirmation policy that never asks, so a conversation can end up on a model nobody chose. These surface the off switch the SDK already exported but the GUI never rendered, and fix a stamp that left the model readout permanently disagreeing with itself after a dropped socket."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16443]
    desc: "A test-suite fallback for `ProgressEvent` that could never install itself: it was guarded on the symbol being missing, and jsdom always defines it. Left MSW's request interceptor free to throw during teardown and fail an otherwise green run."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16279, 16280]
    desc: "The same `SIGHUP` gap as merged #16239, one launcher over in each case. Orphaned services hold their ports, and a surviving agent-server keeps heartbeating its lease files, so the next start reports every conversation as held and lists none."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16311]
    desc: "A context-window usage meter, a usage drawer, and manual compaction, against the maintainers' own issue #16170."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16415]
    desc: "The provider list was truncated at 100 with the server's pagination cursor discarded, so `together_ai`, `vertex_ai`, and `xai` were unreachable in every provider dropdown. Reproduced on unmodified upstream main against Cloud."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16426]
    desc: "Bulk-add a provider's models as LLM profiles, so a catalog becomes usable profiles in one pass instead of one entry at a time."
  - repo: Comfy-Org/ComfyUI_frontend
    name: ComfyUI_frontend
    numbers: [11686]
    desc: "Respect the Reka DismissableLayer state for the Escape key in keybindings."

# --- Adopted upstream: closed PRs whose substance a maintainer shipped, with credit ---
# Deliberately NOT counted as merged receipts: the code that landed is someone
# else's. The claim is "diagnosis accepted", and the upstream PR crediting it is
# what survives a click. Numbers here are also excluded from drift detection.
credited:
  - repo: n8n-io/n8n
    name: n8n
    numbers: [29516]
    desc: "A consecutive-acceptance-timeout disconnect in the task-broker `acceptOffer` path. The maintainer closed this in favour of a PR that re-implements the same mechanism on current master and credits the diagnosis in a section of its own."
    extra: " <a class=\"lnk\" href=\"https://github.com/n8n-io/n8n/pull/35456\">n8n#35456 &rarr;</a> <a class=\"lnk\" href=\"/n8n\">The full hunt &rarr;</a>"

