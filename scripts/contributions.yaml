# --- In-review groups (display) ---
# `gh search --state open` provides liveness; this list provides the prose and
# grouping. Generator renders one <li> per group. Detection flags any open gh
# PR whose repo+number isn't covered here, and any number here that's no longer
# open in gh (it merged or closed).
in_review:
  - repo: OpenHands/software-agent-sdk
    name: "OpenHands / software-agent-sdk"
    numbers: [4799]
    desc: "The conversation and bash event clients only checked `window.WebSocket`, then fell back to `require('ws')` — which does not exist in the package's ESM build, so Node 22+ reported no WebSocket implementation despite shipping a global. Reads `globalThis.WebSocket` directly and drops the `ws` dependency."
  - repo: OpenHands/software-agent-sdk
    name: "OpenHands / software-agent-sdk"
    numbers: [4796]
    desc: "The endpoint-audit CI check failed on every fork PR: posting the report comment 403s on a fork's read-only token, so the job went red before anyone read the audit. The report now always lands in the job summary, and the comment posts only on same-repo PRs."
  - repo: OpenHands/docs
    name: OpenHands / docs
    numbers: [771]
    desc: "Documents the two `MCPToolObservation` fields from software-agent-sdk #4775: `structured_content` and `result_meta` keep an MCP result's `structuredContent` and `_meta` in the serialized observation, so protocol-aware clients receive what the tool actually returned."
  - repo: OpenHands/software-agent-sdk
    name: "OpenHands / software-agent-sdk"
    numbers: [4775]
    desc: "MCP tool results can carry `structuredContent` and result `_meta` alongside their content blocks, and the conversion into `MCPToolObservation` silently discarded both, after which no downstream consumer (event persistence, websocket delivery, protocol-aware clients) could recover them. The observation gains the two fields. Closes #4776."
  - repo: OpenHands/docs
    name: OpenHands / docs
    numbers: [761]
    desc: "Documents the per-call `llm_profile` option from software-agent-sdk #4510: model-selection precedence, unknown-profile errors, resume behavior, and the custom profile-store discovery limitation."
  - repo: OpenHands/software-agent-sdk
    name: "OpenHands / software-agent-sdk"
    numbers: [4510]
    desc: "An optional `llm_profile` field on the task tool, so a parent agent keeps its own model while delegating one task to a cheaper, faster, or specialized saved profile."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16994]
    desc: "The same `release ready` `startup_failure` as typescript-client #364, in the monorepo: 100 runs back to 2026-08-07 all died before any job started, invisible in the Actions UI. One `contents: write` grant in the caller."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [17009]
    desc: "The package declared `engines.node >= 22.12` while every CI pin builds on 24, so npm handed the published package to a runtime nothing tests, with no `EBADENGINE` to warn. `engines` becomes `>=24`, matching what CI builds."
  - repo: OpenHands/docs
    name: OpenHands / docs
    numbers: [757]
    desc: "Documents the offline prompt-composition report from software-agent-sdk #4623: what each component bucket measures, and how to run `scripts/prompt_composition_report.py` against `log_completions` output."
  - repo: OpenHands/software-agent-sdk
    name: "OpenHands / software-agent-sdk"
    numbers: [4565, 4623]
    desc: "A skill or path rule fires once per conversation, on an event condensation is allowed to forget, while the 'already activated' marker persists and is never cleared. After condensation the guidance can be gone from everything the model sees while state still reports it active. Two end-to-end cases run the whole scenario so the intended lifecycle gets settled against observed behavior rather than a reading of the code. #4623: an offline prompt-composition report, `scripts/prompt_composition_report.py`, that ingests `log_completions` output and shows what each LLM call's prompt is made of (system prompt, tool schemas, history, latest message), as a per-call breakdown plus a text chart."
  - repo: anomalyco/opencode
    name: opencode
    numbers: [43685]
    desc: "The Task tool awaited its subagent prompt with no timeout, so a stalled subagent (provider hang, SSE keepalives with no content) hung the parent session with it. Adds an optional `timeout` parameter with a 10-minute default, an env-var override, and `timeout: 0` to wait indefinitely. When it fires the subagent is cancelled and the tool returns a `<task_error>` block carrying the task id for a retry."
  - repo: anomalyco/opencode
    name: opencode
    numbers: [43684]
    desc: "OpenAI's tool-use API rejects function names over 64 characters, so a long MCP server and tool name made the provider return 400 and opencode silently stopped processing. Truncates over-long names to a readable prefix plus a stable hash suffix, so two tools that would otherwise collide stay distinct, and warns instead of dropping one silently."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16426]
    desc: "Adds a provider's whole model catalog as LLM profiles in one pass, instead of one entry at a time."
  - repo: OpenHands/software-agent-sdk
    name: "OpenHands / software-agent-sdk"
    numbers: [4557]
    desc: "A per-conversation deny-list for sub-agents, enforced at the spawn site rather than by hiding the option, so an agent that already knows a disabled agent's name still cannot delegate to it. Issue #4556."
  - repo: OpenHands/OpenHands
    name: OpenHands
    numbers: [16600]
    desc: "Conversation tags a user applies by hand, a filter bar across the panel, and per-card collapse, so a long conversation list stays navigable instead of scrolling forever."
  - repo: livekit/agents
    name: "livekit / agents"
    numbers: [6280]
    desc: "A fix so a duplicate same-target handoff tool call in one turn no longer reads as ambiguous and aborts the agent switch."
  - repo: allenai/open-instruct
    name: open-instruct
    numbers: [1751]
    desc: "A `--launcher` flag so non-Ai2 users can run the training launcher locally without a Beaker cluster account."
  - repo: stryker-mutator/stryker-net
    name: stryker-net
    numbers: [3694]
    desc: "Extends the array-creation mutator to implicit array creation, a syntax shape it previously had no arm for."
  - repo: kputnam/stupidedi
    name: stupidedi
    numbers: [292, 293]
    desc: "Re-enables the 4010 SM204 (Motor Carrier Load Tender) and SH856 (Ship Notice/Manifest, the 856 ASN), third and fourth in the series after PO850 and AR943/RE944, on the same outgrown-segment fix pattern."
  - repo: mitmproxy/mitmproxy
    name: mitmproxy
    numbers: [8199, 8200]
    desc: "A `Flow.kill()` resume-event fix so teardown closes the client connection, plus a KillInjected event so killing a flow disconnects in-transit connections."
  - repo: charmbracelet/crush
    name: "charmbracelet / crush"
    numbers: [2749, 2750]
    desc: "LSP score-based client selection and single-file-server handling, so single-file language servers start without root markers."

# --- Fixed upstream: filed it, someone else's commit carries the fix ---
# Its own list because it is neither of the two above. A closed-unmerged PR is
# not in review, and the commit that landed is not George's, so it must never
# reach `merged:` or the headline count.
#
# Two shapes, two fields, deliberately not interchangeable:
#   shipped_in     -- a maintainer re-implemented the idea and credited it by
#                     name. The strong claim. Only use it when a reader can
#                     click through to the maintainer's own words.
#   fixed_upstream -- the same problem got fixed by someone else's PR, with no
#                     mention of George anywhere. The weak claim, and the honest
#                     one for most of these. Says the problem is gone, no more.
# Add `shipped_in_repo` / `fixed_upstream_repo` if the target lives elsewhere.
#
# Every target must be MERGED. Two earlier candidates failed exactly this test:
# opencode #24871 stood down for #15595, which was later closed unmerged, and
# #25141 for #20103, still open. In both cases the bug is still there, so the
# honest description is "yielded to a PR that stalled", which is not a receipt.
# `verify_upstream_targets` enforces this against live GitHub so the rule is
# checked rather than remembered.
#
# This list is not a ledger of every closed PR and must not be read as one. The
# entry criterion is a merged upstream commit that a reader can open. Closures
# with no upstream landing (CLA machinery that never unstuck, maintainer scope
# calls, stale-bot expiry, ones George withdrew himself) stay off the page.
credited:
  - repo: n8n-io/n8n
    number: 29516
    shipped_in: 35456
    name: n8n
    desc: "A per-runner consecutive-timeout counter that detects and recovers stuck task-runner channels, cutting detection from hours to about six seconds. The PR predated a rework of the same `acceptOffer` path, so a maintainer re-implemented the idea on current master and credited the diagnosis by name. Shipped to the 2.33 and 2.34 release lines."
    extra: ' <a class="lnk" href="/n8n">The full hunt &rarr;</a>'
  - repo: OpenHands/OpenHands
    number: 16415
    fixed_upstream: 16453
    name: OpenHands
    desc: "The Basic LLM provider list stopped at 100 entries because the server's pagination cursor was discarded, putting `together_ai`, `vertex_ai`, and `xai` out of reach in every provider dropdown. Reproduced against unmodified upstream main. #16453 fixed the same bug from the other direction, dropping the limit rather than following the cursor."
  - repo: OpenHands/OpenHands
    number: 16443
    fixed_upstream: 16504
    name: OpenHands
    desc: "A `ProgressEvent` test fallback that could never install itself: it was guarded on the symbol being absent, and jsdom always defines it, which left the request interceptor free to throw during teardown and redden an otherwise passing run. #16504 landed the same root cause. It ships no test, so the 1000-iteration repro lives in that PR's description rather than in the suite."
  - repo: charmbracelet/catwalk
    number: 112
    fixed_upstream: 137
    name: "charmbracelet / catwalk"
    desc: "Added the missing Venice.ai models to the provider catalog by hand. The maintainers took the general fix instead, generating the whole provider config and refreshing it daily, so the catalog stops going stale between contributions."

# --- Search-index gaps: curated PRs that `gh search` genuinely never returns ---
# The header explains why these exist; this list makes it machine-checkable, so
# `test_fixture_covers_every_curated_entry` can demand fixture coverage for
# everything else without false-flagging these three. If a future gh index fixes
# one of these, delete its line and add it to scripts/testdata/prs.json.
search_index_gaps:
  - {repo: anomalyco/models.dev, number: 475, reason: "merged 2025-12; absent from `gh search prs --merged` output"}
  - {repo: anomalyco/opencode, number: 4748, reason: "merged 2025-11; absent from `gh search prs --merged` output"}
  - {repo: WPBuddy/largo, number: 164, reason: "merged 2014; absent from `gh search prs --merged` output"}

